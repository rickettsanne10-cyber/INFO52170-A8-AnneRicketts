name: Python CI Pipeline

on:
  push:
    branches:
      - "**"

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest

      - name: Run linter
        run: |
          flake8 .

      - name: Run tests
        run: |
          pytest